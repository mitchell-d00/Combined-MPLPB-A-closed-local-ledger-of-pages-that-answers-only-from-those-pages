<h1>Dust control</h1>
<p>Never sweep or brush dry. Wet mop the floor and sponge the benches at the end of each session. Wear a fitted P3 half-mask whenever a bag of powder is open; paper masks do not stop respirable silica. Wash aprons weekly rather than shaking them out.</p>
