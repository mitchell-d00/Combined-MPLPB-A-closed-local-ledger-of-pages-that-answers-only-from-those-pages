<h1>Kiln ventilation</h1>
<p>Switch the extractor on before the kiln and leave it running until the pyrometer reads under 200 C. Wax burn-off and sulphur from some clays come off between 200 C and 700 C; keep the kiln room door shut and work elsewhere during that stretch. Spy hole bungs stay in after 600 C.</p>
