<h1>Drying ware</h1>
<p>Dry slowly and evenly. Turn pots onto their rims once they will hold their shape, so the base catches up with the lip. Wrap handles and joins loosely for the first day. A piece is ready when it no longer feels cool against the cheek. Thick sculpture needs two weeks, not two days.</p>
