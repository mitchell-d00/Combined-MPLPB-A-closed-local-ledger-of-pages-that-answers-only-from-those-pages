<h1>Wedging</h1>
<p>Ram's head for small amounts, spiral for anything over two kilos. Thirty turns is a minimum. Cut the lump with a wire and look at the face: it should be one even colour with no holes. Wedge on canvas or bare wood, not on plaster, which chips into the clay and blows out in the kiln.</p>
