<h1>Firing day checklist</h1>
<p>1. Ware bone dry, or glazed feet wiped. 2. Three posts per shelf, aligned. 3. Cone pack visible through the spy hole. 4. Extractor on. 5. Programme matches the load: bisque to 1000 C, glaze to 1222 C. 6. Log the start time on the door sheet.</p>
