<h1>Bisque firing schedule</h1>
<p>Load bone-dry ware only. Climb 100 C per hour to 600 C so chemically bound water can leave without blowing the walls out, then 150 C per hour to 1000 C, which is cone 06. Soak ten minutes. Leave the lid shut until the pyrometer reads under 100 C.</p>
