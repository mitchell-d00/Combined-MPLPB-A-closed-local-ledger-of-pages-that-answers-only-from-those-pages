<h1>Glaze firing schedule, cone 6, electric kiln</h1>
<p>Climb 150 C per hour to 1100 C, then 60 C per hour to 1222 C. Soak fifteen minutes. For matte surfaces drop to 950 C and hold an hour before switching off. Leave the lid shut until the pyrometer reads under 125 C.</p>
