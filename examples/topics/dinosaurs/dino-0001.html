<h1>End-Cretaceous extinction</h1>
<p>Non-avian dinosaurs disappeared around 66 million years ago. The Chicxulub asteroid impact is associated with the end-Cretaceous mass extinction. Birds survived, so dinosaurs did not vanish entirely.</p>
