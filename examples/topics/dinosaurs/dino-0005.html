<h1>Pterosaur boundary</h1>
<p>Pterosaurs were flying reptiles related to dinosaurs but outside the dinosaur group. Their anatomy differs from the diagnostic features of dinosaurs. Sharing an ancient habitat does not make every reptile a dinosaur.</p>
