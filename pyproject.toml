[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "combined-mplpb"
version = "2.1.0rc1"
description = "A closed local ledger of pages that answers only from those pages: return, ambiguous, or not in corpus. Standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mitchell D. McPhetridge" }]
keywords = ["mplpb", "provenance", "ledger", "retrieval", "refusal", "knowledge-base", "stateless-ai"]
dependencies = []

[project.scripts]
mplpb-combined = "mplpb_answers.__main__:main"
mplpb-library = "mplpb_answers.library:main"
mplpb-work = "mplpb_work.__main__:main"
mplpb-evaluate = "mplpb_answers.evaluate:main"

[tool.setuptools]
packages = ["mplpb_combined", "mplpb_answers", "mplpb_work"]
