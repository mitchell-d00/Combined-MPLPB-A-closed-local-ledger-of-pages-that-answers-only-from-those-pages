[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "combined-mplpb"
version = "1.0.0"
description = "A closed local ledger of pages that answers only from those pages: return, ambiguous, or not in corpus. Standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mitchell D. McPhetridge" }]
keywords = ["mplpb", "provenance", "ledger", "retrieval", "refusal", "knowledge-base", "stateless-ai"]
dependencies = []

[project.scripts]
mplpb-combined = "mplpb_combined.__main__:main"

[tool.setuptools]
packages = ["mplpb_combined"]
