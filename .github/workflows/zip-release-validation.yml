name: Verify zipped MPLPB source before merge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-first:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact candidate revision for packaging only
        uses: actions/checkout@v4
        with:
          # pull_request normally checks out a synthetic merge ref, not the PR head.
          # Archive the actual submitted revision and record that exact SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Freeze a ZIP with tracked repo contents and extract it cleanly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mplpb-zipped" "$RUNNER_TEMP/mplpb-unpacked"
          git rev-parse HEAD > "$RUNNER_TEMP/mplpb-zipped/commit.sha"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/mplpb-zipped/tree.sha"
          git archive --format=zip --output="$RUNNER_TEMP/mplpb-zipped/mplpb-repository.zip" HEAD
          cd "$RUNNER_TEMP/mplpb-zipped"
          sha256sum mplpb-repository.zip > mplpb-repository.zip.sha256
          unzip -tq mplpb-repository.zip
          unzip -q mplpb-repository.zip -d "$RUNNER_TEMP/mplpb-unpacked"
          test -f "$RUNNER_TEMP/mplpb-unpacked/index.html"
          test -f "$RUNNER_TEMP/mplpb-unpacked/tools/browser_release_smoke.py"
          echo "ARCHIVE_SHA256=$(cut -d ' ' -f 1 mplpb-repository.zip.sha256)" >> "$GITHUB_ENV"
          echo "Archive SHA-256: $(cat mplpb-repository.zip.sha256)"
          echo "Everything below must run ONLY from the unpacked ZIP."
      - name: Test attack reproductions and all Python tests FROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mplpb-unpacked"
          python -m unittest tests.test_integrity_hunt tests.test_record tests.test_ledger tests.test_literal_evidence tests.test_answer_reliability tests.test_answer_support -q
          python -m unittest discover -s tests -q
      - name: Test JavaScript API, crawler, UI script and bridge FROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mplpb-unpacked"
          python tools/check_ui_script.py
          node tools/check_browser_transport.cjs
          node tests/javascript-api.cjs
          node crawler/test_worker.mjs
          node --check tools/mplpb_agent_bridge.mjs
          node tools/mplpb_agent_bridge.mjs --help
      - name: Download the release-pinned Python WebAssembly runtime
        shell: bash
        run: >-
          curl --fail --location --retry 2
          https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2
          --output "$RUNNER_TEMP/pyodide-core.tar.bz2"
      - name: Build WebAssembly site and execute actual Pyodide tests FROM ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mplpb-unpacked"
          python tools/build_browser_runtime.py --core-archive "$RUNNER_TEMP/pyodide-core.tar.bz2" --output dist/index.html
          tar -xjf "$RUNNER_TEMP/pyodide-core.tar.bz2" -C "$RUNNER_TEMP"
          node tools/check_browser_wasm.mjs "$RUNNER_TEMP/pyodide" dist/index.html
      - name: Install Chromium testing dependencies
        shell: bash
        run: python -m pip install "playwright==1.58.0"
      - name: Test LIVE Pages and ZIP-built candidate using real Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mplpb-unpacked"
          python tools/browser_release_smoke.py \
            --live-url "https://mitchell-d00.github.io/Combined-MPLPB-A-closed-local-ledger-of-pages-that-answers-only-from-those-pages/" \
            --preview-dir dist
      - name: Audit ZIP-built persistence, offline API and responsive layouts
        run: |
          cd "$RUNNER_TEMP/mplpb-unpacked"
          python -m tools.browser_audit_20261021 --preview-dir dist --output "$RUNNER_TEMP/mplpb-zipped/browser-audit"
      - name: Record successful exact-archive release gates
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Git commit packaged: $(cat "$RUNNER_TEMP/mplpb-zipped/commit.sha")"
            echo "Git tree packaged: $(cat "$RUNNER_TEMP/mplpb-zipped/tree.sha")"
            echo "ZIP SHA-256: $ARCHIVE_SHA256"
            echo "Test source: extracted ZIP, not git working tree"
            echo "Python attack and full regression: PASS"
            echo "JavaScript/API/crawler/bridge: PASS"
            echo "Pinned Python WebAssembly engine: PASS"
            echo "Chromium published-live baseline: PASS"
            echo "Chromium ZIP-built candidate: PASS"
            echo "Post-merge deployed-live Chromium: separate Pages deployment gate"
          } > "$RUNNER_TEMP/mplpb-zipped/validation-report.txt"
          cat "$RUNNER_TEMP/mplpb-zipped/validation-report.txt"
          # Copy the exact preview tested in Chromium, then bind all successful
          # gates to this candidate SHA and to content digests. This manifest
          # describes a candidate; post-deployment smoke stays a separate gate.
          cp "$RUNNER_TEMP/mplpb-unpacked/dist/index.html" "$RUNNER_TEMP/mplpb-zipped/mplpb-candidate-preview.html"
          cd "$RUNNER_TEMP/mplpb-unpacked"
          python tools/release_evidence.py create \
            --archive-dir "$RUNNER_TEMP/mplpb-zipped" \
            --expected-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          python tools/release_evidence.py verify \
            --archive-dir "$RUNNER_TEMP/mplpb-zipped" \
            --expected-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve source ZIP, hash, commit and gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mplpb-tested-repository-zip-${{ github.run_id }}
          path: ${{ runner.temp }}/mplpb-zipped/
          if-no-files-found: error
          retention-days: 30
