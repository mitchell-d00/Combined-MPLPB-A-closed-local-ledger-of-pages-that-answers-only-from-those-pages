name: Replay the original sealed Cryptid D% public inputs
on:
  push:
    branches: ['study/egyptian-gods-attribution-scope']
    paths: ['.github/workflows/cryptid-dpercent-replay.yml']
permissions:
  contents: read
jobs:
  dpercent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the original D% isolator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo env PYTHONPATH="$PWD" MPLPB_REQUIRE_SANDBOX=1 "$(command -v python)" -m unittest tests.test_study_sandbox -v
      - id: replay
        name: Replay the sealed D% draws and restored Round 2 primary
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath

          digest = lambda data: hashlib.sha256(data).hexdigest()
          plan_bytes = Path('evaluation/cryptid/full-reproducible-replay/coverage-manifest-v1.json').read_bytes()
          plan = json.loads(plan_bytes)
          base = Path(os.environ['RUNNER_TEMP'])
          output = base/'cryptid-dpercent'
          output.mkdir()
          (output/'manifest.sha256').write_text(digest(plan_bytes)+'\n')
          supplement = Path('evaluation/cryptid/full-reproducible-replay/round2-primary-rebuild-freeze-v1.json').read_bytes()
          rebuild = json.loads(supplement)
          assert rebuild['coverage_manifest_sha256']==digest(plan_bytes)
          (output/'round2-rebuild.sha256').write_text(digest(supplement)+'\n')
          packets = []
          worker_hash = digest(Path('tools/dpercent_worker.py').read_bytes())
          for spec in [*plan['special_cohorts'], rebuild['spec']]:
              if spec['id'] not in {'bunyip-dpercent-development','bunyip-dpercent-fresh-consumed','bunyip-round2-primary'}:
                  continue
              label = spec['id']
              raw = Path(spec['packet']).read_bytes()
              assert digest(raw)==spec['packet_sha256']
              public = base/label
              public.mkdir()
              with zipfile.ZipFile(Path(spec['packet'])) as original:
                  public_seal = original.read('public/seal.json')
                  seal = json.loads(public_seal)
                  if label=='bunyip-round2-primary':
                      assert digest(public_seal)==spec['public_seal_sha256']
                      assert set(original.namelist())=={'public/seal.json', *('public/'+name for name in seal['public_files'])}
                  else:
                      record = Path(spec['seal']).read_bytes()
                      assert digest(record)==spec['seal_sha256']
                      assert seal==json.loads(record)['public_seal']
                  assert seal['worker_sha256']==worker_hash
                  for relative, expected in seal['public_files'].items():
                      p = PurePosixPath(relative)
                      assert not p.is_absolute() and '..' not in p.parts and p.name not in {'key.json','dice.json','pairing.json'}
                      data = original.read('public/'+relative)
                      assert digest(data)==expected
                      target=public/relative
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(data)
                  (public/'seal.json').write_bytes(public_seal)
              packets.append((label,public))
          assert len(packets)==3
          root = Path.cwd()
          git_objects = Path(subprocess.check_output(['git','rev-parse','--absolute-git-dir'],text=True).strip())/'objects'
          statuses = []
          for role, pin in plan['readers'].items():
              source = pin['commit']
              archive = output/(role+'-runtime.zip')
              subprocess.run(['git','fetch','--depth=1','origin',source],check=True)
              subprocess.run(['git','archive','--format=zip','-0','-o',str(archive),source,
                              'mplpb_answers','mplpb_combined','mplpb_work'],check=True)
              assert digest(archive.read_bytes())==pin['sha256']
              runtime = base/('dpercent-runtime-'+role)
              runtime.mkdir()
              with zipfile.ZipFile(archive) as source_archive:
                  source_archive.extractall(runtime)
              # The original runner records the host checkout identity. Its worker
              # receives copies of the three packages and has no access to .git.
              subprocess.run(['git','init','--quiet',str(runtime)],check=True)
              (runtime/'.git/objects/info/alternates').write_text(str(git_objects)+'\n')
              (runtime/'.git/HEAD').write_text(source+'\n')
              assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=runtime,text=True).strip()==source
              stage=output/role
              stage.mkdir()
              for label, public in packets:
                  command=['sudo','env','MPLPB_REQUIRE_SANDBOX=1','PYTHONPATH='+str(root),sys.executable,
                           'GIT_CONFIG_COUNT=2','GIT_CONFIG_KEY_0=safe.directory','GIT_CONFIG_VALUE_0='+str(root),
                           'GIT_CONFIG_KEY_1=safe.directory','GIT_CONFIG_VALUE_1='+str(runtime),
                           '-m','tools.dpercent','run','--packets',str(public),'--out',str(stage/label),
                           '--implementation',str(runtime)]
                  with (stage/(label+'.log')).open('x') as log:
                      status=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT).returncode
                  statuses.append({'role':role,'cohort':label,'exit_code':status})
                  (output/'execution.json').write_text(json.dumps(statuses,indent=2)+'\n')
                  print(role,label,status,flush=True)
          if any(x['exit_code'] for x in statuses):
              raise SystemExit(1)
          PY
      - id: safety
        name: Check retained output scope
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/cryptid-dpercent"; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/cryptid-dpercent"
            if find "$RUNNER_TEMP/cryptid-dpercent" -iname '*key.json' -print -quit | grep -q .; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.safety.outcome != 'failure'
        with:
          name: cryptid-dpercent-public-replay-${{ github.sha }}
          path: ${{ runner.temp }}/cryptid-dpercent/
          if-no-files-found: warn
          retention-days: 90
