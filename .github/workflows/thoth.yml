name: Thoth isolated comparison using Cryptid v5
on:
  push:
    branches: ['local/bunyip-round2']
    paths: ['evaluation/egyptian-gods/thoth/phase.txt']
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        name: Verify synthetic publication scope
        run: |
          mkdir -p "$RUNNER_TEMP/thoth"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('evaluation/egyptian-gods/thoth')
          phase=(root/'phase.txt').read_text().strip()
          assert phase in {'development','fresh'}
          home=root/phase
          freeze=json.loads((home/'freeze.json').read_text())
          assert freeze['public_raw_output'] is True
          raw=(home/'registry.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==freeze['registry_sha256']
          rows=json.loads(raw)['cases']
          assert len(rows)==12
          for row in rows:
              assert re.fullmatch(r'EGY-THOTH-[DF][0-9]{2}-[AB]',row['id'])
              path=Path(row['packet'])
              assert path==home/'inputs'/row['id']
              assert {p.name for p in path.iterdir()}=={'case.json'}
              data=(path/'case.json').read_bytes()
              assert hashlib.sha256(data).hexdigest()==row['files']['case.json']
              s=json.loads(data)
              assert s['id']==row['id'] and s['adapter_mode']=='documentary'
              assert all(x['id'] in {'SYN-A','SYN-B'} and x['origin']=='machine' for x in s['sources'])
          PY
          echo 'approved=yes' >> "$GITHUB_OUTPUT"
      - name: Require existing study isolator
        run: |
          set -euo pipefail
          { sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap; } 2>&1 | tee "$RUNNER_TEMP/thoth/install.log"
          sudo env PYTHONPATH="$PWD" MPLPB_REQUIRE_SANDBOX=1 "$(command -v python)" -m unittest tests.test_study_sandbox -v 2>&1 | tee "$RUNNER_TEMP/thoth/preflight.log"
      - name: Compare pinned runtimes using Cryptid v5
        run: |
          set -euo pipefail
          PYTHON="$(command -v python)"
          HOME_PATH=evaluation/egyptian-gods/thoth
          OUT="$RUNNER_TEMP/thoth"
          PHASE="$(cat "$HOME_PATH/phase.txt")"
          failed=0
          for role in released c3 wampus thoth; do
            read -r PIN ZIP < <(python -c 'import json,sys; d=json.load(open(sys.argv[1]))[sys.argv[2]]; print(d["commit"],d["runtime_zip_sha256"])' "$HOME_PATH/readers.json" "$role")
            git fetch --depth=1 origin "$PIN"
            git archive --format=zip -0 --output="$OUT/$role-runtime.zip" "$PIN" mplpb_answers mplpb_combined mplpb_work
            echo "$ZIP  $OUT/$role-runtime.zip" | sha256sum --check | tee -a "$OUT/runtime-hashes.log"
            unzip -q "$OUT/$role-runtime.zip" -d "$RUNNER_TEMP/$role"
            sudo env PYTHONPATH="$PWD" "$PYTHON" tools/cryptid_trial_v5.py --registry "$HOME_PATH/$PHASE/registry.json" --implementation "$RUNNER_TEMP/$role" --source-commit "$PIN" --output "$OUT/$PHASE-$role" 2>&1 | tee "$OUT/$PHASE-$role.log" || failed=1
            if test "$role" = thoth && test "$PHASE" = development; then
              for arm in development R X; do
                sudo env PYTHONPATH="$PWD" "$PYTHON" tools/cryptid_trial_v5.py --registry "evaluation/cryptid/bunyip/round2/replacement/$arm/registry.json" --implementation "$RUNNER_TEMP/$role" --source-commit "$PIN" --output "$OUT/bunyip-$arm-thoth" 2>&1 | tee "$OUT/bunyip-$arm-thoth.log" || failed=1
              done
              for arm in development fresh; do
                sudo env PYTHONPATH="$PWD" "$PYTHON" tools/cryptid_trial_v5.py --registry "evaluation/cryptid/wampus-cat/$arm/registry.json" --implementation "$RUNNER_TEMP/$role" --source-commit "$PIN" --output "$OUT/wampus-$arm-thoth" 2>&1 | tee "$OUT/wampus-$arm-thoth.log" || failed=1
              done
            fi
          done
          exit "$failed"
      - name: Retain public worker outputs and startup logs
        if: always() && steps.scope.outputs.approved == 'yes'
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/thoth"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.approved == 'yes'
        with:
          name: thoth-${{ github.sha }}
          path: ${{ runner.temp }}/wampus/
          retention-days: 90
