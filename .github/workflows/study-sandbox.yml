name: Verify isolated study worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  study-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and identify the OS isolator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
          uname -r
      - name: Require actual isolation, not skipped capability checks
        run: |
          STUDY_TEST_PYTHON="$(command -v python)"
          mkdir -p "$RUNNER_TEMP/mplpb-sandbox-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/mplpb-sandbox-source"
          cd "$RUNNER_TEMP/mplpb-sandbox-source"
          sudo env PYTHONPATH="$PWD" MPLPB_REQUIRE_SANDBOX=1 "$STUDY_TEST_PYTHON" -m unittest tests.test_study_sandbox -v
      - name: Replay one frozen D% case per executable class
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          study="$(mktemp -d)"
          reports="$RUNNER_TEMP/mplpb-dpercent-smoke"
          mkdir "$reports"
          python -m tools.dpercent_weaknesses prepare --out "$study/packets" --custodian "$study/keys" --cases 75 --seed 2026112003 --shard-size 25
          runner_env=(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE")
          run_args=(--packets "$study/packets" --custodian "$study/keys" --output "$study/results" --workers 3)
          if ! sudo env "${runner_env[@]}" "$(command -v python)" -m tools.dpercent_weakness_batch "${run_args[@]}"; then
            for log in "$study"/results/shard-0001/DP00001/{failure.json,worker.log}; do
              if test -f "$log"; then head -c 4096 "$log"; fi
            done
            if test -f "$study/results/summary.json"; then
              cp "$study/results/summary.json" "$reports/summary.json"
            fi
            exit 1
          fi
          cp "$study/results/summary.json" "$reports/summary.json"
          python - "$study/results/summary.json" <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import sys

          summary = json.loads(Path(sys.argv[1]).read_text())
          families = summary['by_family']
          counts = Counter()
          for row in families.values():
              counts.update(row['outcomes'])
          assert len(families) == summary['executed'] == summary['completed'] == 75
          print(f"75 cases across 75 D% classes: {dict(counts)}")
          PY
      - name: Retain D% aggregate results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dpercent-75-class-smoke
          path: ${{ runner.temp }}/mplpb-dpercent-smoke/summary.json
          if-no-files-found: ignore
      - name: Run frozen FRUS correspondence packets in the existing isolator
        if: github.event_name == 'pull_request' && github.head_ref == 'evaluation/public-correspondence-baseline'
        run: |
          set -euo pipefail
          lab=evaluation/archival-inspection/frus-correspondence-01
          out="$RUNNER_TEMP/frus-correspondence"
          mkdir "$out"
          if test -f "$lab/RESULTS.md"; then
            printf '%s\n' 'First sandbox run is retained in the evidence checkpoint.' > "$out/retained.log"
            exit 0
          fi
          python_path="$(command -v python)"
          git rev-parse HEAD > "$out/checked-head"
          uname -r > "$out/kernel"
          bwrap --version > "$out/bwrap"
          sudo env PYTHONPATH="$PWD" MPLPB_REQUIRE_SANDBOX=1 "$python_path" \
            -m unittest tests.test_study_sandbox -v 2>&1 | tee "$out/preflight.log"
          for packet in smoke location relation documentary; do
            mkdir "$out/$packet"
            cp "$lab/corpus.json" "$lab/packets/$packet/"*.json "$out/$packet/"
            sudo env PYTHONPATH="$PWD" "$python_path" -m tools.historical_study \
              run "$out/$packet" --sandboxed 2>&1 | tee "$out/$packet/execution.log"
            sudo chmod a+r "$out/$packet/"*.json
          done
      - name: Retain FRUS sandbox and first-run artifacts
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'evaluation/public-correspondence-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: frus-correspondence-first-run
          path: ${{ runner.temp }}/frus-correspondence
          if-no-files-found: ignore
