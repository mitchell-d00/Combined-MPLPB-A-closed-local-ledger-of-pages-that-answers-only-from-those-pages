name: Bounded documentary acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify field obligations, eligibility, and communication candidates
        run: |
          python -m unittest tests.test_compound_fields tests.test_field_aliases tests.test_scoped_extensions tests.test_pinned_documentary_inspection -v
          node tests/documentary-render.cjs
          python -m tools.evaluate_public_evidence --output "$RUNNER_TEMP/bounded-public-controls.json" --require-capabilities
      - name: Install the isolated D% worker dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Replay the unchanged 1,000-case source packets
        run: |
          # The isolated worker cannot bind the Actions workspace below /home.
          stage="$(sudo mktemp -d /tmp/mplpb-bounded.XXXXXX)"
          status=0
          sudo "$(command -v python)" -m tools.verify_bounded_reported_content --output "$stage/bounded-repair" || status=$?
          sudo cp -R "$stage/bounded-repair" "$RUNNER_TEMP/bounded-repair"
          if ((status)); then
            find "$RUNNER_TEMP/bounded-repair/run" -name failure.json -print -quit |
              while IFS= read -r failure; do head -20 "$(dirname "$failure")/worker.log"; done
          fi
          exit "$status"
      - name: Replay the 22 historical development questions
        if: success() || failure()
        run: |
          python -m tools.article_study --output "$RUNNER_TEMP/bounded-historical"
          python - "$RUNNER_TEMP/bounded-historical/report.json" <<'PY'
          import csv
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text())
          # Keep the old case-by-case record intact. Apply only the two
          # reviewed transitions from the historical seam replay.
          transition = json.loads(Path(
              "evaluation/d12/pattern-sprints/historical-seams/comparison.json"
          ).read_text())
          def cases(path):
              with path.open(newline="") as stream:
                  return list(csv.DictReader(stream))
          current = cases(Path(sys.argv[1]).with_name("cases.csv"))
          baseline = cases(Path("evaluation/field-aliases/2026-11-20/final/historical/cases.csv"))
          changes = transition["changes_excluding_code_fingerprints"]
          seen = set()
          for row in baseline:
              if row["id"] not in changes:
                  continue
              delta = changes[row["id"]]
              if row["native_kind"] != delta["before"] or row["assembled_kind"] != delta["before"]:
                  raise SystemExit("Historical transition does not match the frozen baseline")
              row.update(native_kind=delta["after"], assembled_kind=delta["after"],
                         answer_supported=str(delta["after"] == "supported_answer"))
              seen.add(row["id"])
          if (report["cases"] != 22 or seen != set(changes) or current != baseline
                  or report["native_outcomes"] != transition["new_outcomes"]
                  or not all(report["guards"].values())):
              raise SystemExit("Historical development replay changed beyond the recorded transitions")
          from test_tools.d12 import audit_original
          from tools.unprepared_challenge import sha
          replay = Path(sys.argv[1]).parent
          audit = audit_original(replay, {"native_replay_sha256": sha((replay / "packets.json.gz").read_bytes())})
          counts = {name: value for name, value in audit.items() if name != "rows"}
          if counts != transition["citation_audit"]:
              raise SystemExit("Historical citation readback differs from the recorded transition")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bounded-repair/acceptance.json
            ${{ runner.temp }}/bounded-repair/prior-v1-acceptance.json
            ${{ runner.temp }}/bounded-repair/run/run.json
            ${{ runner.temp }}/bounded-repair/run/*/failure.json
            ${{ runner.temp }}/bounded-repair/run/*/worker.log
            ${{ runner.temp }}/bounded-historical/report.json
            ${{ runner.temp }}/bounded-historical/cases.csv
            ${{ runner.temp }}/bounded-public-controls.json
          if-no-files-found: warn
