name: Publish MPLPB browser runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mplpb-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Python engine and browser bridge
        run: python -m unittest discover -s tests -q
      - name: Check desktop UI and browser transport
        run: |
          python tools/check_ui_script.py
          node tools/check_browser_transport.cjs
          node crawler/test_worker.mjs
      - name: Download pinned Python WebAssembly core
        run: >-
          curl --fail --location --retry 2
          https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2
          --output "$RUNNER_TEMP/pyodide-core.tar.bz2"
      - name: Build site entry point and verify release digest
        run: >-
          python tools/build_browser_runtime.py
          --core-archive "$RUNNER_TEMP/pyodide-core.tar.bz2"
          --output dist/index.html
      - name: Test actual WebAssembly engine
        run: |
          tar -xjf "$RUNNER_TEMP/pyodide-core.tar.bz2" -C "$RUNNER_TEMP"
          node tools/check_browser_wasm.mjs "$RUNNER_TEMP/pyodide" dist/index.html
          touch dist/.nojekyll
      - name: Build installation packages
        run: |
          python tools/build_release_packages.py
          python -m pip wheel --no-deps --wheel-dir release .
          python -m venv "$RUNNER_TEMP/mplpb-install"
          "$RUNNER_TEMP/mplpb-install/bin/pip" install --no-deps release/*.whl
          "$RUNNER_TEMP/mplpb-install/bin/mplpb-combined" --help
      - name: Run synthetic context matrix
        run: python -m tools.evaluate_context_matrix --output release/context-matrix.json
      - name: Upload installation packages
        uses: actions/upload-artifact@v4
        with:
          name: mplpb-monster
          path: release/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy browser runtime
        id: deployment
        uses: actions/deploy-pages@v4
