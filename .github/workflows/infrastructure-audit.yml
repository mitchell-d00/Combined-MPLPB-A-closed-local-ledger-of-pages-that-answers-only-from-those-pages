name: Audit MPLPB supporting infrastructure and public Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '19 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure-sync:
    name: infrastructure-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail on stale UI, JavaScript API, docs, corpus or packaging links
        run: python tools/check_repository_infrastructure.py
      - name: Test real public JavaScript API contract and source UI
        run: |
          python tools/check_ui_script.py
          node tests/javascript-api.cjs
          node tools/check_browser_transport.cjs
      - name: Audit the deployed Pages WebAssembly app with Chromium weekly
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install "playwright==1.58.0"
          python tools/browser_release_smoke.py \
            --live-url "https://mitchell-d00.github.io/Combined-MPLPB-A-closed-local-ledger-of-pages-that-answers-only-from-those-pages/" \
            --live-updated
