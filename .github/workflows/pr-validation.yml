name: Validate proposed MPLPB changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  researcher-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser automation
        run: python -m pip install "playwright==1.58.0"
      - name: Download pinned WebAssembly core
        run: >-
          curl --fail --location --retry 2
          https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2
          --output "$RUNNER_TEMP/pyodide-core.tar.bz2"
      - name: Build candidate runtime
        run: python tools/build_browser_runtime.py --core-archive "$RUNNER_TEMP/pyodide-core.tar.bz2" --output dist/index.html
      - name: Run visible-control researcher journey before long regressions finish
        run: python -m tools.browser_researcher_pilot --preview-dir dist --output "$RUNNER_TEMP/npc-browser/report.json"
      - name: Verify user-built policies, revision and permitted fixture acquisition in Chromium
        run: python -m tools.browser_collection_policies --preview-dir dist --browser-executable "$(command -v google-chrome)" --output "$RUNNER_TEMP/npc-browser/collection-policies.json"
      - name: Retain synthetic browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: researcher-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/npc-browser/
          if-no-files-found: warn
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test integrity regressions and evidence rules
        run: python -m unittest tests.test_integrity_hunt tests.test_record tests.test_ledger tests.test_literal_evidence tests.test_answer_reliability tests.test_answer_support -q
      - name: Validate source-evidence graph and synthetic users against frozen probes
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evaluation"
          python -m unittest tests.test_relation_graph tests.test_relation_graph_synthetic_users tests.test_operational_evidence -v
          python -m tools.simulate_relation_graph_users --output "$RUNNER_TEMP/graph-evaluation/synthetic-users.json"
          python -m tools.evaluate_relation_graph --output "$RUNNER_TEMP/graph-evaluation/frozen-retest.json"
      - name: Retain graph retest and synthetic-user evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-graph-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-evaluation/
          if-no-files-found: warn
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -q
      - name: Run complete synthetic researcher journeys
        run: python -m tools.evaluate_researcher_pilot --output "$RUNNER_TEMP/npc-pilot/native.json"
      - name: Audit JavaScript, crawler and browser transport
        run: |
          python tools/check_ui_script.py
          node tools/check_browser_transport.cjs
          node tests/javascript-api.cjs
          node crawler/test_worker.mjs
      - name: Report inspected external coverage (development only)
        run: python -m tools.evaluate_literal_coverage
      - name: Download pinned WebAssembly core
        run: >-
          curl --fail --location --retry 2
          https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2
          --output "$RUNNER_TEMP/pyodide-core.tar.bz2"
      - name: Build standalone browser runtime
        run: >-
          python tools/build_browser_runtime.py
          --core-archive "$RUNNER_TEMP/pyodide-core.tar.bz2"
          --output dist/index.html
      - name: Test real Python/WebAssembly engine
        run: |
          tar -xjf "$RUNNER_TEMP/pyodide-core.tar.bz2" -C "$RUNNER_TEMP"
          node tools/check_browser_wasm.mjs "$RUNNER_TEMP/pyodide" dist/index.html
      - name: Prepare Chromium smoke-test dependencies
        run: |
          python -m pip install "playwright==1.58.0"
      - name: Test published site and proposed WebAssembly UI in Chromium
        run: >-
          python tools/browser_release_smoke.py
          --live-url
          https://mitchell-d00.github.io/Combined-MPLPB-A-closed-local-ledger-of-pages-that-answers-only-from-those-pages/
          --preview-dir dist
          --npc-report "${{ runner.temp }}/npc-pilot/browser.json"
      - name: Audit persistence, offline API and responsive layouts
        run: >-
          python -m tools.browser_audit_20261021 --preview-dir dist
          --live-url https://mitchell-d00.github.io/Combined-MPLPB-A-closed-local-ledger-of-pages-that-answers-only-from-those-pages/
          --output audit-browser-results
      - name: Preserve additional browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            audit-browser-results/
            ${{ runner.temp }}/npc-pilot/
          if-no-files-found: warn
