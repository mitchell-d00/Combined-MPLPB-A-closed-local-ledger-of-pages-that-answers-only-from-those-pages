name: Bubble and Wrap evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bubble-wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit frozen inputs, attempts, scores and current acceptance
        run: |
          python tools/bubble_wrap_review.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evaluation/bubble-wrap/2026-11-25')
          fresh=json.loads((root/'fresh-transfer/completion.json').read_text())
          score=json.loads((root/'fresh-transfer/candidate-score.json').read_text())
          assert fresh['candidate_runs']==1
          assert fresh['acceptance_passed'] and fresh['native_fingerprints_unchanged_after_open']
          assert score['counts']['scored']==score['counts']['passed']==24
          assert not score['counts'].get('false_supported_claim_cases',0)
          # This audits the once-only receipt; it does not rerun transfer.
          PY
